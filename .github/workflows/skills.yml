name: Skills

# This repository ships Markdown, so this workflow opts in to Markdown paths.
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - packages.json
      - skills-lock.json
      - scripts/validate.mjs
      - scripts/validate.test.ts
      - scripts/naming.mjs
      - scripts/sync.mjs
      - scripts/collection-metadata.ts
      - scripts/collection-metadata.test.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/skills.yml
  pull_request:
    paths:
      - 'skills/**'
      - packages.json
      - skills-lock.json
      - scripts/validate.mjs
      - scripts/validate.test.ts
      - scripts/naming.mjs
      - scripts/sync.mjs
      - scripts/collection-metadata.ts
      - scripts/collection-metadata.test.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/skills.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check every Skill
        run: node scripts/validate.mjs

      - name: Test Skill validation
        run: node --test scripts/*.test.ts
